<style>
:root{
  --bg:#07050b; --surface:#120d1c; --raised:#1b1429; --line:#2c2243;
  --text:#f2eefb; --muted:#9a8fb8; --violet:#8b5cf6; --lilac:#b79cff; --orchid:#d08bff;
  --gold:#fbbf24; --gold-rgb:251,191,36; --danger:#fb7185;
  --on-acc:#fff; --acc2:#a855f7; --acc-rgb:139,92,246; --hero1:#1d1433; --bg-rgb:7,5,11; --nav-rgb:10,7,16; --toast:#241a3b;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100vh}
main{padding:18px 16px 120px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:13px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:rgba(var(--nav-rgb),.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:flex;width:100%;max-width:560px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;color:var(--muted);font-size:12px;font-weight:600}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--lilac)}
.nav button.on svg{stroke:var(--orchid)}

/* hero */
.datebar{margin-bottom:12px}
.date{color:var(--muted);font-size:14px}
.date::first-letter,.uc::first-letter{text-transform:uppercase}
.themerow{position:relative;display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.themerow::-webkit-scrollbar{display:none}
.themerow .chip{white-space:nowrap;flex:0 0 auto;padding:7px 12px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:7px}
.sw{width:16px;height:16px;border-radius:50%;flex:0 0 auto}


.set.warn .check{border-color:var(--gold);box-shadow:0 0 0 2px rgba(var(--gold-rgb),.25)}
.set.warn .setno{color:var(--gold)}
.hero{background:linear-gradient(160deg,var(--hero1) 0%,var(--surface) 60%);border:1px solid var(--line);border-radius:28px;padding:22px 20px 20px;margin-bottom:16px}
.hero .lbl{color:var(--lilac);font-weight:600;font-size:14px;margin:0 0 2px}
.hero h1{font-size:54px;line-height:1;font-weight:800}
.hero .focus{font-family:var(--display);font-size:22px;font-weight:600;color:var(--lilac);margin:4px 0 12px}
.hero .exlist{color:var(--muted);font-size:14px;margin:0 0 18px}
.cta{width:100%;background:linear-gradient(135deg,var(--violet),var(--acc2));color:var(--on-acc);font-weight:700;font-size:18px;padding:17px;border-radius:18px}
.cta:active{transform:scale(.98)}
.ghost{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-weight:600;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{color:var(--text);border-color:var(--violet)}
.link{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;margin-top:12px;display:inline-block}

/* week */
.week{display:flex;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:22px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.wd i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line)}
.wd.has i{background:linear-gradient(135deg,var(--violet),var(--orchid));border-color:transparent}
.wd.today i{border-color:var(--lilac)}
.wd.tcard{color:var(--text)}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 12px}
.sec h2{font-size:22px;font-weight:700}
.sec button{color:var(--lilac);font-weight:600;font-size:14px}

/* lifts */
.lift{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.lift .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lift .nm{font-family:var(--display);font-weight:700;font-size:20px}
.lift .val{font-weight:700;font-size:15px;color:var(--lilac)}
.lift .val b{font-family:var(--display);font-size:26px;color:var(--text);font-weight:800}
.plates{height:16px;border-radius:9px;background:var(--raised);position:relative;overflow:hidden;margin:12px 0 8px}
.plates i{position:absolute;inset:0 auto 0 0;width:var(--p);background:linear-gradient(90deg,var(--violet),var(--orchid));border-radius:9px;transition:width .6s ease}
.plates::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--tick) - 2px),rgba(var(--bg-rgb),.95) calc(var(--tick) - 2px),rgba(var(--bg-rgb),.95) var(--tick))}
.badge{display:inline-block;background:rgba(var(--gold-rgb),.14);color:var(--gold);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.bigrow{display:flex;align-items:baseline;gap:8px}
.big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.pbar{height:8px;border-radius:5px;background:var(--raised);overflow:hidden;margin:12px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--orchid));border-radius:5px}

/* workout */
.wk-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(var(--bg-rgb),.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.wk-top .ttl{flex:1;min-width:0}
.wk-top .ttl b{font-family:var(--display);font-size:19px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-top .ttl span{color:var(--muted);font-size:13px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.finish{background:linear-gradient(135deg,var(--violet),var(--acc2));color:var(--on-acc);font-weight:700;border-radius:12px;padding:10px 16px}
.wk{padding:14px 12px 170px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 12px 12px;margin-bottom:14px}
.ex h3{font-size:20px;font-weight:700;padding:0 4px}
.ex .tg{padding:0 4px;color:var(--lilac);font-weight:600;font-size:14px;margin-top:2px}
.ex .nt{padding:0 4px;color:var(--muted);font-size:13px}
.ex .last{margin:10px 4px 6px;padding:8px 12px;background:var(--raised);border-radius:12px;font-size:13px;color:var(--muted)}
.ex .last b{color:var(--text);font-weight:600}
.cols,.set{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center}
.cols.t,.set.t{grid-template-columns:26px 1fr 46px}
.cols{padding:6px 0 4px;color:var(--muted);font-size:12px;font-weight:600;text-align:center}
.set{padding:4px 0}
.setno{text-align:center;color:var(--muted);font-weight:700}
.step{display:flex;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:14px;overflow:hidden;height:48px}
.step button{width:32px;height:100%;font-size:20px;color:var(--lilac);font-weight:700}
.step input{width:100%;min-width:0;height:100%;text-align:center;background:none;border:0;font-weight:700;font-size:18px;font-family:var(--display);padding:0}
.step input:focus{outline:none;background:rgba(var(--acc-rgb),.14)}
.step:focus-within{border-color:var(--violet)}
.check{width:46px;height:48px;border-radius:14px;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.check svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.set.done .step{border-color:rgba(var(--acc-rgb),.5);background:rgba(var(--acc-rgb),.14)}
.set.done .check{background:linear-gradient(135deg,var(--violet),var(--orchid));border-color:transparent;color:var(--on-acc)}
.meta{display:flex;gap:8px;justify-content:flex-end;padding:0 0 4px;margin-top:-1px}
.rir{background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;color:var(--lilac)}
.pr{background:rgba(var(--gold-rgb),.14);color:var(--gold);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700}
.exbtns{display:flex;gap:8px;margin-top:8px;padding:0 2px}
.exbtns button{flex:1;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:10px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.exbtns button.add{color:var(--lilac)}
.addex{width:100%;border:1.5px dashed var(--line);border-radius:20px;padding:16px;color:var(--lilac);font-weight:700}
.rest{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:45;max-width:540px;margin:0 auto;background:var(--hero1);border:1px solid var(--violet);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.rest .t{font-family:var(--display);font-weight:800;font-size:30px;min-width:74px}
.rest .bar{flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.rest .bar i{display:block;height:100%;background:var(--orchid);width:100%}
.rest button{background:var(--raised);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px}

/* sheet */
.bd{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ph h2{font-size:22px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.in{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;min-height:46px}
.in:focus{outline:none;border-color:var(--violet)}
textarea.in{min-height:120px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.erow{background:var(--raised);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.erow .g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.erow .acts{display:flex;gap:8px;margin-top:10px}
.erow .acts button{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px;font-weight:600}
.erow .acts .rm{color:var(--danger)}
.btn{width:100%;background:linear-gradient(135deg,var(--violet),var(--acc2));color:var(--on-acc);font-weight:700;padding:14px;border-radius:14px;font-size:16px;margin-top:6px}
.btn.sec2{background:var(--raised);border:1px solid var(--line);color:var(--text)}
.btn.danger{background:rgba(251,113,133,.14);border:1px solid rgba(251,113,133,.4);color:var(--danger)}
.pick{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pick button{text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600}

/* lists */
.dayc{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:10px}
.dayc b{font-family:var(--display);font-size:19px}
.seg{display:flex;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--violet);color:var(--on-acc)}
.sel{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;font-family:var(--display);font-weight:700;font-size:20px;margin-bottom:14px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--lilac) 50%),linear-gradient(135deg,var(--lilac) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:800}
.stat span{font-size:12px;color:var(--muted)}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 8px 6px}
.chartbox svg{display:block;width:100%;height:auto}
.logrow{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:15px}
.logrow:last-child{border-bottom:0}
.logrow span:first-child{color:var(--muted)}
.sesc{background:var(--surface);border:1px solid var(--line);border-radius:20px;margin-bottom:10px;overflow:hidden}
.sesh{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:14px 16px}
.sesh b{font-family:var(--display);font-size:18px;display:block}
.sesb{padding:0 16px 14px}
.sesb .e{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.sesb .e b{display:block;font-weight:700}
.sesb .e span{color:var(--muted)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--toast);border:1px solid var(--violet);border-radius:14px;padding:12px 18px;font-weight:600;z-index:140;max-width:90vw;text-align:center;animation:up .2s ease}
.goalin{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* ===== final polish ===== */
html{background:var(--bg);overscroll-behavior-y:none}
body{background:radial-gradient(120% 360px at 50% -60px,rgba(var(--acc-rgb),.2),transparent 72%) no-repeat,var(--bg);-webkit-text-size-adjust:100%}
button,.chip,.dayc,.sesh{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.step button:active{background:rgba(var(--acc-rgb),.28)}
.chip:active,.ghost:active,.dayc:active,.sesh:active,.exbtns button:active,.addex:active{transform:scale(.97)}
.nav-in{position:relative}
.nav .ind{position:absolute;top:0;left:0;width:20%;height:3px;display:flex;justify-content:center;transform:translateX(calc(var(--i,0)*100%));transition:transform .42s cubic-bezier(.3,1.35,.5,1);pointer-events:none}
.nav .ind i{width:38px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--violet),var(--acc2));box-shadow:0 3px 16px 1px rgba(var(--acc-rgb),.8)}
.nav button svg{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.nav button.on svg{transform:translateY(-2px) scale(1.12)}

/* barbell */
.bb{display:block;width:100%;height:auto;margin:8px 0 6px;overflow:visible}
.plate{transform-box:fill-box;transform-origin:center}
.tip{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;font-size:14px;color:var(--muted)}
.tip b{color:var(--text);display:block;margin-bottom:2px}
.tip button{margin-left:auto;color:var(--muted);padding:2px 6px;font-size:18px}

/* motion */
.cta{position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;top:0;bottom:0;left:0;width:38%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:translateX(-130%) skewX(-20deg);animation:sheen 6.5s ease-in-out 2s infinite;pointer-events:none}
@keyframes sheen{0%,72%{transform:translateX(-130%) skewX(-20deg)}100%{transform:translateX(330%) skewX(-20deg)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes plateIn{from{opacity:0;transform:scale(.3,.15)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes drawl{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes ring{from{opacity:.9;transform:scale(.7)}to{opacity:0;transform:scale(2.1)}}
@keyframes badge{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 0 0 rgba(var(--gold-rgb),0)}50%{box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 0 7px rgba(var(--gold-rgb),.28)}}
main.fx.t{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
main.fx .hero{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
main.fx .plate{animation:plateIn .55s cubic-bezier(.2,1.1,.3,1) both;animation-delay:calc(var(--k)*90ms + var(--n,0)*140ms + 350ms)}
main.fx .plate.ghost{animation:fadeIn .6s ease both;animation-delay:calc(var(--k)*90ms + var(--n,0)*140ms + 900ms)}
main.fx .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:drawl 1.1s .12s cubic-bezier(.4,.6,.2,1) forwards}
main.fx .ar{animation:fadeIn .9s .6s both}
main.fx .dt{animation:fadeIn .4s 1s both}
.set.just .check svg{animation:pop .42s cubic-bezier(.3,1.5,.5,1)}
.set .check{position:relative}
.set.just .check::after{content:"";position:absolute;inset:0;border-radius:14px;border:2px solid var(--orchid);animation:ring .6s ease-out forwards;pointer-events:none}
.pr.new{animation:badge .6s cubic-bezier(.3,1.5,.5,1) both}
.rest.show{animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
.rest.low{border-color:var(--gold);animation:pulse 1s ease-in-out infinite}
.rest.low .bar i{background:var(--gold)}

/* program editor + day view */
.erow{padding:0;overflow:hidden;transition:transform .18s ease}
.ehead{display:flex;align-items:center;gap:2px;padding:4px 6px 4px 2px}
.grip{width:44px;height:50px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;flex:0 0 auto;border-radius:12px}
.grip svg{width:20px;height:20px;fill:currentColor}
.grip:active{color:var(--lilac)}
.etitle{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;padding:6px 4px}
.etitle b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.etitle span{font-size:13px;color:var(--muted)}
.ech{width:40px;height:44px;display:grid;place-items:center;color:var(--muted)}
.ech svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.ech.open svg{transform:rotate(180deg)}
.ebody{padding:0 12px 12px}
.panel.dragmode .ebody{display:none}
.erow.dragging{position:relative;z-index:5;transition:none;border-color:var(--violet);background:var(--surface);box-shadow:0 14px 34px rgba(0,0,0,.55)}
button.wd{padding:2px 4px}
.wd.plan i{border-style:dashed;border-color:var(--violet)}
.wd:active i{transform:scale(.86)}
.exh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.exh h3{flex:1;min-width:0}
.mv{display:flex;gap:6px}
.mv button{width:34px;height:34px;border-radius:10px;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.mv svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dv .logrow span:first-child{color:var(--text);font-weight:600}
.dv .small{color:var(--muted);font-weight:400}


/* coach, sore, backup */
.sorebtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}
.sorebtn b{display:block;font-family:var(--display);font-size:17px}
.sch{display:inline-flex;align-items:center;gap:6px;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:10px 15px;font-weight:600;font-size:14px;color:var(--muted)}
.sch.l1{border-color:var(--gold);color:var(--gold);background:rgba(var(--gold-rgb),.1)}
.sch.l2{border-color:var(--danger);color:var(--danger);background:rgba(251,113,133,.14)}
.card.dl{border-color:rgba(var(--gold-rgb),.55);background:linear-gradient(160deg,rgba(var(--gold-rgb),.13),var(--surface))}
.card.dl b{color:var(--gold)}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.rec .rh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.rec .rh b{font-family:var(--display);font-size:19px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rg div{background:var(--raised);border-radius:14px;padding:10px 12px}
.rg span{display:block;font-size:12px;color:var(--muted)}
.rg b{display:block;font-family:var(--display);font-size:17px}
.rg i{font-style:normal;font-size:12px;color:var(--muted)}
.vrow{display:grid;grid-template-columns:120px 1fr 36px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.vbar{position:relative;height:10px;border-radius:6px;background:var(--raised)}
.vbar i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:linear-gradient(90deg,var(--violet),var(--orchid))}
.vbar i.low{background:var(--gold)}
.vbar u{position:absolute;top:-3px;bottom:-3px;left:50%;width:2px;background:var(--text);opacity:.45}
.vrow b{text-align:right}
.sug{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.sug>div{flex:1}
.sug b{font-family:var(--display);font-size:18px;display:block}
.sug p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.tp{margin:10px 4px 4px;padding:10px 12px;border-radius:12px;background:rgba(var(--gold-rgb),.1);border:1px solid rgba(var(--gold-rgb),.4);font-size:13px}
.tp button{display:block;margin-top:8px;color:var(--gold);font-weight:700}
.msg{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;background:var(--raised);border:1px solid var(--line)}
.msg.err{border-color:var(--danger);color:var(--danger)}
.msg.ok{border-color:var(--orchid);color:var(--lilac)}
.steps{margin:6px 0 12px 18px;padding:0;font-size:13px;color:var(--muted)}
.steps li{margin-bottom:4px}
.sw2{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}


/* ===== v6: preloader, burger, home, body ===== */
html.nopre .pre{display:none}
.pre{position:fixed;inset:0;z-index:300;background:radial-gradient(70% 320px at 50% 46%,rgba(76,64,214,.26),transparent 70%) no-repeat,#030309;color:#eef1fc;font-family:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;overflow:hidden;transition:opacity .55s ease,transform .55s ease}
.pre.out{opacity:0;transform:scale(1.05);pointer-events:none}
.pre .halo{position:absolute;left:50%;top:44%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:radial-gradient(circle,rgba(120,90,255,.34),transparent 66%);opacity:0;animation:fadeIn .8s .2s forwards}
.pre .gauge{position:absolute;left:50%;top:44%;width:250px;height:250px;margin:-125px 0 0 -125px;opacity:0;transform:scale(.78);animation:gIn .7s cubic-bezier(.2,.9,.2,1) .15s forwards}
.pre .gauge svg{display:block;width:100%;height:100%;overflow:visible}
@keyframes gIn{to{opacity:1;transform:none}}
.pre .tk{stroke:rgba(255,255,255,.2);stroke-width:1.6;stroke-linecap:round;opacity:0;animation:fadeIn .3s forwards;animation-delay:calc(.3s + var(--i)*.025s)}
.pre .tk.mj{stroke:rgba(255,255,255,.5);stroke-width:2.4}
.pre .word{position:absolute;left:0;right:0;top:calc(44% + 160px);display:flex;justify-content:center;font-weight:800;font-size:44px;letter-spacing:.01em;line-height:1.1}
.pre .word span{display:inline-block;opacity:0;background:linear-gradient(180deg,#fff 10%,#b9c6ff 55%,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pup .7s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(2.15s + var(--i)*.05s)}
@keyframes pup{0%{opacity:0;transform:translateY(16px);filter:blur(8px)}100%{opacity:1;transform:none;filter:blur(0)}}
.burger{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;z-index:35;width:44px;height:44px;border-radius:14px;background:rgba(var(--bg-rgb),.82);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.burger svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.dr{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .28s}
.dr.open{opacity:1;pointer-events:auto}
.drp{position:absolute;top:0;right:0;bottom:0;width:min(86vw,340px);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1);padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;overflow:auto}
.dr.open .drp{transform:none}
.drh{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px}
.drh h2{font-size:24px}
.dri{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:16px;text-align:left;width:100%}
.dri:active{background:var(--raised)}
.dri .ic{width:42px;height:42px;border-radius:13px;background:var(--raised);display:grid;place-items:center;color:var(--lilac);flex:0 0 auto}
.dri .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dri b{display:block;font-family:var(--display);font-size:17px}
.dri .s{font-size:13px;color:var(--muted)}
.drf{margin-top:auto;padding:14px 8px 0;font-size:12px;color:var(--muted)}
.pghead{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.pghead h1{font-size:28px;font-weight:800}

.topl{display:flex;align-items:baseline;gap:12px;margin:2px 0 14px}
.topl h1{font-size:30px;font-weight:800}
.topl .date{font-size:14px;color:var(--muted)}
.tcard{background:linear-gradient(160deg,var(--hero1),var(--surface) 72%);border:1px solid var(--line);border-radius:24px;padding:16px 16px 12px;margin-bottom:14px}
.tcard .lbl{font-size:13px;color:var(--lilac);font-weight:700;margin:0;display:flex;gap:8px;align-items:center}
.tcard h2{font-size:30px;font-weight:800;line-height:1.1;margin:2px 0 10px}
.tcard h2 small{display:block;font-size:17px;font-weight:600;color:var(--lilac);margin-top:3px}
.tl{list-style:none;margin:0 0 12px;padding:0}

var EXD={"Squat": {"p": "sq", "s": ["Stå med fødderne i skulderbredde og tæerne lidt ud. Stangen hviler på øvre ryg.", "Træk vejret ind, spænd mavemusklerne og sænk dig ned, så lårene mindst er parallelle med gulvet.", "Pres igennem hele foden og rejs dig, mens knæene følger tæerne."], "t": "Hold brystet oppe og hælene i gulvet hele vejen.", "u": "Stang og stativ"}, "Front squat": {"p": "sqf", "s": ["Stangen ligger foran på skuldrene, og albuerne peger fremad og op.", "Sænk dig lige ned med oprejst overkrop, til lårene er parallelle.", "Rejs dig ved at presse gennem foden, og hold albuerne høje."], "t": "Albuerne skal ikke falde. Gør de det, så er vægten for tung.", "u": "Stang og stativ"}, "Goblet squat": {"p": "gob", "s": ["Hold en håndvægt eller kettlebell tæt ind til brystet.", "Sænk dig ned mellem knæene med oprejst overkrop.", "Pres op igen, og hold vægten tæt på kroppen."], "t": "En god øvelse til at lære dybden og holde ryggen ret.", "u": "Håndvægt eller kettlebell"}, "Hack squat": {"p": "hack", "s": ["Stil dig i maskinen med ryggen mod pladen og fødderne forrest på platformen.", "Sænk kontrolleret, til knæene er bøjet cirka 90 grader eller mere.", "Pres platformen væk, men lås ikke knæene helt ud."], "t": "Fødder lavt på platformen rammer mere af lårenes forside.", "u": "Hack squat-maskine"}, "Benpres": {"p": "lpress", "s": ["Sæt dig med ryggen fladt mod puden og fødderne i skulderbredde på pladen.", "Sænk pladen, indtil knæene er bøjet cirka 90 grader, uden at numsen løfter sig fra sædet.", "Pres pladen væk, og stop lige før knæene låses."], "t": "Lad aldrig knæene falde indad.", "u": "Benpres-maskine"}, "Bulgarian split squat": {"p": "bulg", "s": ["Læg bagerste fod på en bænk og tag et langt skridt frem med den forreste.", "Sænk dig lige ned, til forreste lår er cirka parallelt med gulvet.", "Pres op gennem forreste hæl. Tag alle gentagelser på ét ben, før du skifter."], "t": "Et langt skridt frem gør det lettere at holde balancen.", "u": "Bænk og håndvægte"}, "Udfald": {"p": "lunge", "s": ["Stå oprejst og tag et skridt frem.", "Sænk bagerste knæ mod gulvet, mens forreste knæ følger tæerne.", "Skub fra med forreste fod, og kom tilbage til start."], "t": "Hold overkroppen oprejst og kig fremad.", "u": "Håndvægte (valgfrit)"}, "Step-ups": {"p": "stepup", "s": ["Stil en fod fast på en kasse eller bænk.", "Pres igennem hælen på den forreste fod, og stå helt op på kassen.", "Sænk dig kontrolleret ned igen. Tag alle gentagelser på ét ben, og skift så."], "t": "Brug det forreste ben til at løfte dig, ikke det bagerste.", "u": "Kasse og håndvægte"}, "Let squat": {"p": "sq", "s": ["Stå med fødderne i skulderbredde.", "Sænk dig kontrolleret ned i en komfortabel dybde.", "Rejs dig igen med rolig bevægelse."], "t": "Brug en let vægt og fokuser på teknikken.", "u": "Stang eller kropsvægt"}, "Leg extension": {"p": "legext", "s": ["Indstil maskinen, så knæene står ud for drejepunktet, og puden ligger over anklerne.", "Stræk benene, til de er næsten helt rette, og spænd lårene i toppen.", "Sænk langsomt tilbage uden at slippe vægten ned."], "t": "Pause et sekund i toppen for at få mest ud af øvelsen.", "u": "Leg extension-maskine"}, "Dødløft": {"p": "dl", "s": ["Stå med stangen over midten af foden og fødderne i hoftebredde. Tag fat lige uden for benene.", "Spænd ryggen og maven, og pres gulvet væk, mens stangen holdes tæt på benene.", "Stå helt op med hofterne fremme, og sænk stangen kontrolleret tilbage."], "t": "Ryggen skal være lige hele vejen, aldrig rundet.", "u": "Stang og vægtskiver"}, "Rumænsk dødløft": {"p": "rdl", "s": ["Stå med let bøjede knæ og stangen foran lårene.", "Skub hofterne bagud, og lad stangen glide ned langs benene, til du mærker strækket i baglårene.", "Skub hofterne fremad, og rejs dig."], "t": "Knæene er næsten stille. Det er hoften, der bevæger sig.", "u": "Stang eller håndvægte"}, "Hip thrust": {"p": "hipt", "s": ["Sæt øvre ryg mod en bænk, og læg stangen over hofterne med en pude.", "Pres hofterne op, til kroppen danner en lige linje fra knæ til skulder.", "Spænd balderne i toppen, og sænk kontrolleret."], "t": "Hagen mod brystet og skinnebenene lodrette i toppen.", "u": "Bænk og stang"}, "Good morning": {"p": "gm", "s": ["Stangen ligger på øvre ryg, og knæene er let bøjede.", "Skub hofterne bagud, og læn overkroppen frem med lige ryg.", "Når du mærker strækket i baglårene, rejser du dig igen ved at skubbe hofterne frem."], "t": "Brug lettere vægt end du tror. Ryggen skal blive lige.", "u": "Stang og stativ"}, "Back extension": {"p": "backext", "s": ["Placer hofterne på puden, og kryds armene foran brystet.", "Sænk overkroppen ned fra hoften med lige ryg.", "Løft kroppen, til den er i lige linje med benene. Gå ikke længere op."], "t": "Spænd balderne, og undgå at overstrække lænden.", "u": "Back extension-bænk"}, "Hamstring curl, liggende": {"p": "curll", "s": ["Læg dig på maskinen med knæene lige uden for bænkens kant og puden over anklerne.", "Bøj knæene, og træk hælene mod numsen.", "Sænk langsomt tilbage, uden at hofterne løfter sig."], "t": "Tryk hofterne ned i bænken hele vejen.", "u": "Leg curl-maskine"}, "Hamstring curl, siddende": {"p": "curls", "s": ["Sæt dig tilbage i sædet, og indstil puden lige over anklerne.", "Træk hælene ned og tilbage mod sædet.", "Lad langsomt vægten føre benene tilbage."], "t": "Sid ret og hold hofterne i sædet.", "u": "Siddende leg curl-maskine"}, "Hamstring curl, stående": {"p": "curlst", "s": ["Stil dig ved maskinen, og lad puden ligge bag på anklen på det ene ben.", "Bøj knæet, og træk hælen mod numsen.", "Sænk kontrolleret, og tag alle gentagelser på ét ben, før du skifter."], "t": "Hold hofterne stille og overkroppen ret.", "u": "Stående leg curl-maskine"}, "Leg curl": {"p": "curll", "s": ["Læg dig på maskinen med puden over anklerne.", "Bøj knæene, og træk hælene mod numsen.", "Sænk langsomt tilbage."], "t": "Kontrolleret sænkning giver mest effekt.", "u": "Leg curl-maskine"}, "Calf raises, stående": {"p": "calfst", "s": ["Stå med forfødderne på en kant og hælene frit.", "Pres op på tæerne så højt du kan, og hold et sekund i toppen.", "Sænk hælene langsomt, til du mærker et stræk i læggene."], "t": "Fuldt udslag giver mest. Spring ikke bevægelsen over.", "u": "Kant eller maskine"}, "Calf raises, siddende": {"p": "calfse", "s": ["Sid med puden på knæene og forfødderne på platformen.", "Pres hælene op, og hold et sekund i toppen.", "Sænk langsomt for et fuldt stræk."], "t": "Siddende rammer den dybe lægmuskel bedst.", "u": "Siddende calf-maskine"}, "Calf raises": {"p": "calfst", "s": ["Stå med forfødderne på en kant.", "Pres op på tæerne, og hold kort i toppen.", "Sænk langsomt til fuldt stræk."], "t": "Brug hele bevægelsen, ikke korte hop.", "u": "Kant eller maskine"}, "Calf raise i benpres": {"p": "calflp", "s": ["Sæt dig i benpressen med forfødderne nederst på pladen og benene næsten strakte.", "Pres tæerne frem, som om du står på tæer.", "Lad pladen komme tilbage, til du mærker strækket i læggene."], "t": "Lås ikke knæene. Bevægelsen sker kun i anklen.", "u": "Benpres-maskine"}, "Bænkpres": {"p": "bench", "s": ["Læg dig på bænken med øjnene under stangen og fødderne i gulvet. Træk skulderbladene sammen.", "Sænk stangen kontrolleret til midten af brystet.", "Pres stangen op, til armene er næsten strakte."], "t": "Hold skulderbladene samlet og stabile hele sættet.", "u": "Stang og bænk"}, "Bænkpres med pause": {"p": "bench", "s": ["Læg dig på bænken som til almindelig bænkpres.", "Sænk stangen til brystet, og hold den helt stille i cirka 1 sekund.", "Pres eksplosivt op."], "t": "Pausen fjerner afsæt fra brystet og gør dig stærkere i bunden.", "u": "Stang og bænk"}, "Incline bænkpres": {"p": "incl", "s": ["Indstil bænken til cirka 30 grader og læg dig ned.", "Sænk stangen til øvre bryst.", "Pres op igen, og hold albuerne lidt ind mod kroppen."], "t": "Vælg en lav hældning. Bliver den for stejl, rammer du mest skuldrene.", "u": "Stang og skråbænk"}, "Incline dumbbell press": {"p": "incl", "s": ["Indstil bænken til cirka 30 grader, og hold en håndvægt i hver hånd ved skuldrene.", "Pres håndvægtene op, til armene er næsten strakte.", "Sænk langsomt, til du mærker et stræk i brystet."], "t": "Håndvægte giver et større bevægeudslag end stang.", "u": "Håndvægte og skråbænk"}, "Dumbbell bænkpres": {"p": "bench", "s": ["Læg dig på bænken med en håndvægt i hver hånd ved brystet.", "Pres håndvægtene op over brystet.", "Sænk kontrolleret, til albuerne er lige under bænkens højde."], "t": "Hold håndledene lige og over albuerne.", "u": "Håndvægte og bænk"}, "Chest press maskine": {"p": "seatp", "s": ["Indstil sædet, så håndtagene er i brysthøjde.", "Pres håndtagene frem, til armene er næsten strakte.", "Lad langsomt armene vende tilbage."], "t": "Hold skuldrene nede og ryggen mod puden.", "u": "Chest press-maskine"}, "Dips": {"p": "dips", "s": ["Tag fat i parallelstængerne, løft dig op med strakte arme og læn dig let frem.", "Sænk kroppen, til overarmene er cirka parallelle med gulvet.", "Pres dig op igen, men lås ikke albuerne helt ud."], "t": "Hold albuerne tæt ind for triceps, og lad dem gå ud for mere bryst.", "u": "Dipsstativ"}, "Cable fly": {"p": "fly", "s": ["Stå mellem to taljer med en let bøjning i albuerne.", "Før hænderne sammen foran brystet i en bred bue.", "Åbn langsomt armene igen, til du mærker et stræk i brystet."], "t": "Det er en isolationsøvelse. Brug lettere vægt end til pres.", "u": "Kabelmaskine"}, "Pec deck": {"p": "pecd", "s": ["Sid med ryggen mod puden og albuerne i skulderhøjde mod armpuderne.", "Pres armene sammen foran brystet.", "Åbn kontrolleret, og stop, før skuldrene trækkes for langt bagud."], "t": "Pres med brystet, ikke med hænderne.", "u": "Pec deck-maskine"}, "Push-ups": {"p": "push", "s": ["Stå i planke med hænderne lidt bredere end skuldrene og kroppen i lige linje.", "Sænk brystet mod gulvet med albuerne cirka 45 grader ud fra kroppen.", "Pres dig op igen, mens du holder maven og balderne spændt."], "t": "Lad ikke lænden hænge. Hold kroppen som en bræt.", "u": "Kropsvægt"}, "Barbell row": {"p": "brow", "s": ["Stå med let bøjede knæ og læn overkroppen frem med lige ryg. Hold stangen i strakte arme.", "Træk stangen mod navlen, og pres skulderbladene sammen.", "Sænk stangen kontrolleret ned igen."], "t": "Træk med albuerne, ikke med hænderne.", "u": "Stang"}, "Pull-ups": {"p": "pullup", "s": ["Tag fat i stangen med et overgreb, lidt bredere end skuldrene.", "Træk dig op, til hagen er over stangen.", "Sænk dig langsomt ned til strakte arme."], "t": "Start med at trække skuldrene ned, før du bøjer albuerne.", "u": "Chinsstang"}, "Chin-ups": {"p": "pullup", "s": ["Tag fat i stangen med et undergreb i skulderbredde.", "Træk dig op, til hagen er over stangen.", "Sænk dig langsomt til strakte arme."], "t": "Undergreb bruger mere biceps, så det er ofte lettere end pull-ups.", "u": "Chinsstang"}, "Lat pulldown": {"p": "pulld", "s": ["Sæt dig, og lås lårene under puderne. Tag fat i stangen lidt bredere end skuldrene.", "Træk stangen ned til øvre bryst, mens du trækker albuerne ned og ind.", "Lad stangen stige langsomt tilbage til strakte arme."], "t": "Læn dig kun en smule tilbage, og undgå at svinge.", "u": "Latmaskine"}, "Lat pulldown ergogrip": {"p": "pulld", "s": ["Sæt dig, og tag fat i ergogrebet med håndfladerne mod hinanden.", "Træk grebet ned mod øvre bryst, og før albuerne ind mod siderne.", "Lad grebet stige kontrolleret op."], "t": "Det neutrale greb er ofte skånsomt for skuldre og albuer.", "u": "Latmaskine med ergogreb"}, "Seated row": {"p": "srow", "s": ["Sæt dig med fødderne mod platformen og let bøjede knæ. Tag fat i håndtaget.", "Træk håndtaget mod maven, og pres skulderbladene sammen.", "Før armene langsomt frem igen uden at runde ryggen."], "t": "Overkroppen er stille. Det er ryggen, der arbejder.", "u": "Kabelmaskine"}, "Chest-supported row": {"p": "csrow", "s": ["Læg dig med brystet mod en skråbænk og en håndvægt i hver hånd.", "Træk albuerne op og tilbage, og pres s , "s": ["Stå med en håndvægt i hver hånd og let bøjede albuer.", "Løft armene ud til siden, til de er i skulderhøjde.", "Sænk langsomt uden at svinge med kroppen."], "t": "Tænk på at løfte albuerne, ikke hænderne. Brug let vægt.", "u": "Håndvægte"}, "Cable lateral raise": {"p": "latr", "s": ["Stil dig sidelæns ved en lav talje, og tag fat i håndtaget med den fjerneste hånd.", "Løft armen ud til siden, til den er i skulderhøjde.", "Sænk langsomt tilbage."], "t": "Kablet giver konstant spænding, også i bunden af bevægelsen.", "u": "Kabelmaskine"}, "Rear delt fly": {"p": "rdf", "s": ["Læn dig frem fra hoften med lige ryg og en håndvægt i hver hånd.", "Løft armene ud til siden med let bøjede albuer.", "Sænk langsomt."], "t": "Pres skulderbladene let sammen i toppen.", "u": "Håndvægte eller pec deck"}, "Face pulls": {"p": "facep", "s": ["Sæt en tov i en talje i ansigtshøjde, og træk i begge ender med strakte arme.", "Træk mod ansigtet, så albuerne går højt og ud til siden.", "Før armene langsomt frem igen."], "t": "En god øvelse til skuldrenes sundhed og holdningen.", "u": "Kabelmaskine og tov"}, "Upright row": {"p": "uprow", "s": ["Stå med et let overgreb og hænderne tæt foran lårene.", "Træk vægten op langs kroppen, til den når brysthøjde, med albuerne højere end hænderne.", "Sænk kontrolleret."], "t": "Stop i brysthøjde. Højere kan stramme skuldrene.", "u": "Stang eller håndvægte"}, "Shrugs": {"p": "shrug", "s": ["Stå med en tung håndvægt i hver hånd og armene strakte.", "Løft skuldrene lige op mod ørerne, og hold kort i toppen.", "Sænk langsomt uden at rulle skuldrene."], "t": "Kun skuldrene bevæger sig. Armene er strakte.", "u": "Håndvægte eller stang"}, "Biceps curl": {"p": "curl", "s": ["Stå med en håndvægt i hver hånd og albuerne ind mod siderne.", "Bøj albuerne, og løft vægten mod skuldrene.", "Sænk langsomt til strakte arme."], "t": "Lad ikke albuerne vandre fremad, og undgå at svinge.", "u": "Håndvægte eller stang"}, "Hammer curl": {"p": "curl", "s": ["Hold hå function guessGroup(n){
  n=String(n).toLowerCase();
  if(/underarm|wrist|håndled/.test(n))return 'Underarm';
  if(/hamstring|leg|ben|calf|læg|squat|lunge|udfald|dødløft|hip|balle/.test(n))return 'Ben';
  if(/biceps|curl/.test(n))return 'Biceps';
  if(/triceps|pushdown|skull/.test(n))return 'Triceps';
  if(/bryst|bænk|press|fly|dips|push/.test(n))return 'Bryst';
  if(/row|pull|ryg|lat/.test(n))return 'Ryg';
  if(/skulder|raise|shrug/.test(n))return 'Skuldre';
  if(/mave|crunch|plank|abs|twist/.test(n))return 'Mave';
  return null;
}
function libFind(name){var n=String(name).toLowerCase();for(var i=0;i<LIB.length;i++)if(LIB[i][0].toLowerCase()===n)return LIB[i];return null}

function records(name){
  var H=hist(name),kind=kindOf(name),mk=null,mr=null,be=null,one=null;
  H.forEach(function(e){e.sets.forEach(function(s){
    if(kind==='time'){if(!mr||s.reps>mr.reps)mr={reps:s.reps,kg:0,date:e.date};return}
    if(s.kg>0&&(!mk||s.kg>mk.kg||(s.kg===mk.kg&&s.reps>mk.reps)))mk={kg:s.kg,reps:s.reps,date:e.date};
    if(s.reps>0&&(!mr||s.reps>mr.reps||(s.reps===mr.reps&&s.kg>mr.kg)))mr={reps:s.reps,kg:s.kg,date:e.date};

}

function todLabel(h){return h<7?'tidlig morgen':h<11?'formiddag':h<15?'middag':h<19?'eftermiddag':'aften'}
function pad2(n){return n<10?'0'+n:''+n}
function readiness(dayId){
  var ds=todayStr(),ci=S.checkin[ds]||{},h=new Date().getHours(),adv=[],score=0,why=[];
  if(ci.sleep!=null){
    if(ci.sleep>=7.5)score+=1;
    else if(ci.sleep>=6.5){}
    else if(ci.sleep>=5.5){score-=1;why.push('lidt søvn');adv.push('Stop 2–3 reps før grænsen i dag, og hold øje med teknikken.')}

  }
  var food=ci.food||(h<8?'intet':h>=20?'fuld':'let'),inferred=!ci.food;
  if(food==='fuld')score+=1;
  if(food==='intet'){score-=1;why.push('tom mave');adv.push('Spis noget let med kulhydrat 45–60 minutter før (banan, toast eller havregryn), og drik vand.')}

  if(h>=21)adv.push('Sen træning: undgå de tungeste sæt tæt på sengetid, og få protein bagefter.');
  var level=score>=2?'god':score>=0?'ok':score>=-2?'lav':'meget lav';
  return{level:level,score:score,why:why,adv:adv,food:food,inferred:inferred,sleep:ci.sleep,h:h,
    setMod:(level==='lav'||level==='meget lav')?-1:0,load:level==='lav'?.95:level==='meget lav'?.9:1,answered:ci.sleep!=null};

  var h=new Date().getHours(),d=S.daily[todayStr()]||{},g=waterGoal(),w=d.w||0,out=[];

  else if(h<17)out.push({i:'walk',t:'Har du bevæget dig i dag?',x:'En gåtur på 20–30 minutter hjælper restitutionen, også på hviledage.'});

/* ---------- progression + warm-up ---------- */
function repRange(r){var n=String(r).match(/\d+/g);if(!n)return{lo:8,hi:8};var lo=+n[0],hi=+(n[1]||n[0]);return{lo:lo,hi:Math.max(lo,hi)}}
function targetRepsFor(name){var r='';S.program.forEach(function(d){d.exercises.forEach(function(e){if(e.name.toLowerCase()===name.toLowerCase())r=e.reps})});return r}
function nextSuggest(name,targetReps,kind){
  var H=hist(name);if(!H.length)return null;
  var sets=H[H.length-1].sets;if(!sets.length)return null;
  if(kind==='time'){var b=0;sets.forEach(function(x){if(x.reps>b)b=x.reps});return{text:(b+5)+' sek'}}
  var rng=repRange(targetReps||defaultsFor(name).reps),top=0;
  sets.forEach(function(x){if(x.kg>top)top=x.kg});
  if(top<=0)return null;
  var atTop=sets.filter(function(x){return x.kg>=top-1e-6}),step=S.settings.step;
  var allHit=atTop.every(function(x){return x.reps>=rng.hi}),anyLow=atTop.some(function(x){return x.reps<rng.lo});
  var hard=sets.some(function(x){return x.rir!=null&&x.est===false&&x.rir<=0});
  if(allHit&&!hard)return{text:fmt(top+step)+' kg × '+rng.lo};
  if(anyLow)return{text:fmt(top)+' kg, ram '+rng.lo+' reps i alle sæt'};
  var mn=Math.min.apply(null,atTop.map(function(x){return x.reps})),nr=Math.min(rng.hi,mn+1);
  return{text:fmt(top)+' kg × '+nr};
}
function nextBanner(ex){
  if(!S.active||S.active.deload||ex.target==='1RM-test')return '';
  var sg=nextSuggest(ex.name,ex.targetReps,ex.kind);if(!sg)return '';
  return '<div class="last nx">Forslag: <b>'+esc(sg.text)+'</b></div>';
}
function nextList(ses){
  var rows=[];
  ses.exercises.forEach(function(e){if(rows.length>=5)return;var sg=nextSuggest(e.name,targetRepsFor(e.name),e.kind);if(sg)rows.push('<div><span>'+esc(e.name)+'</span><span>'+esc(sg.text)+'</span></div>')});
  return rows.length?'<div class="nxl"><b>Til næste gang</b>'+rows.join('')+'</div>':'';
}
function warmSets(w){
  var st=S.settings.step,seen={},out=[];
  [[.4,8],[.6,5],[.8,3]].forEach(function(x){var kg=Math.max(20,Math.round(w*x[0]/st)*st);if(kg<w&&!seen[kg]){seen[kg]=1;out.push({kg:kg,reps:x[1],rir:null,done:false,warm:true})}});
  return out;
}
function warmIndex(){
  if(!S.active)return -1;
  for(var i=0;i<S.active.exercises.length;i++){
    var e=S.active.exercises[i],l=libFind(e.name),f=e.sets.find(function(x){return !x.warm}),w=f?num(f.kg):0;
    if(e.kind!=='time'&&l&&l[4]==='c'&&w>=30)return i;

}

/* ---------- deload ---------- */
function deloadOn(){return !!(S.deload&&S.deload.every>0)}
function initDeload(){
  if(!S.deload)S.deload={every:6,next:null};
  if(deloadOn()&&!S.deload.next){
    var ss=sortedSessions(),first=ss.length?ss[0].date:todayStr();
    S.deload.next=addDays(mondayOf(first),(S.deload.every-1)*7);
  }
}
function rollDeload(){
  initDeload();if(!deloadOn())return;
  var t=mondayOf(todayStr()),n=0;
  while(addDays(S.deload.next,7)<=t&&n<80){S.deload.next=addDays(S.deload.next,S.deload.every*7);n++}
}
function isDeloadWeek(ds){
  if(!deloadOn()||!S.deload.next)return false;
  var m=mondayOf(ds);
  if(m<S.deload.next)return false;
  return (daysBetween(S.deload.next,m)/7)%S.deload.every===0;
}
function deloadFor(day){
  return day.exercises.map(function(e){
    var H=hist(e.name),l=H.length?H[H.length-1]:null,kg=null,top=0;
    if(l&&e.kind!=='time'){l.sets.forEach(function(s){if(s.kg>top)top=s.kg});if(top>0)kg=r25(top*0.9)}
    return{name:e.name,kind:e.kind||'reps',sets:Math.max(1,Math.ceil((e.sets||2)*0.6)),reps:e.reps,kg:kg,top:top,note:'Deload: stop 3–4 reps før grænsen'};
  });
}
function deloadBanner(){
  if(!deloadOn())return '';
  var today=todayStr();
  if(isDeloadWeek(today))return '<div class="card dl"><b>Deload-uge</b><p class="small muted" style="margin:4px 0 0">Ca. 60 % af sættene og ca. 90 % af din vægt. Stop 3–4 reps før grænsen. Vægtene er foreslået ud fra dine seneste pas.</p></div>';
  for(var k=1;k<=3;k++){var d=addDays(today,k);if(isDeloadWeek(d)&&!isDeloadWeek(addDays(d,-1)))return '<div class="card"><b>Deload-uge starter '+esc(fmtDate(d))+'</b><p class="small muted" style="margin:4px 0 0">Næste uge er let. Så er du frisk til at presse igen bagefter.</p></div>'}
  return '';
}

/* ---------- 1RM planning ---------- */
var MAIN1=['Bænkpres','Squat','Dødløft','Stående skulderpres','Barbell row'];
function dayHas(id,name){var d=S.program.find(function(x){return x.id===id});return !!d&&d.exercises.some(function(e){return e.name.toLowerCase()===name.toLowerCase()})}
var _pc={k:'',v:null};
function plans1RM(){
  var k=S.sessions.length+'|'+todayStr()+'|'+JSON.stringify(S.deload)+'|'+JSON.stringify(S.plan)+'|'+JSON.stringify(S.program.map(function(d){return d.id+d.exercises.length}));
  if(_pc.k===k)return _pc.v;
  var names=MAIN1.slice();S.goals.lifts.forEach(function(g){if(names.indexOf(g.name)<0)names.push(g.name)});
  var today=todayStr(),sch=schedule(120),out=[];
  names.forEach(function(name){
    var H=hist(name);if(!H.length||kindOf(name)==='time')return;
    var first=H[0].date,last1=null,best=0,recent=0,since=addDays(today,-56);
    H.forEach(function(e){e.sets.forEach(function(s){
      if(s.reps===1&&s.kg>0)last1=e.date;
      if(s.kg>0&&s.reps>0&&s.reps<=12){var v=e1rm(s.kg,s.reps);if(v>best)best=v;if(e.date>=since&&v>recent)recent=v}
    })});
    var e1=recent||best;if(e1<=0)return;
    var earliest=addDays(first,28);if(last1&&addDays(last1,56)>earliest)earliest=addDays(last1,56);if(earliest<today)earliest=today;
    var elig=sch.filter(function(e){return e.status==='train'&&e.date>=earliest&&dayHas(e.dayId,name)&&!isDeloadWeek(e.date)});
    var after=elig.find(function(e){return deloadOn()&&isDeloadWeek(addDays(e.date,-7))});
    var pick=(after&&daysBetween(earliest,after.date)<=42)?after:elig[0];
    var ladder=[[.4,5],[.6,3],[.75,2],[.85,1]].map(function(x){return{kg:r25(e1*x[0]),reps:x[1]}}).concat([.93,.97,1.01].map(function(x){return{kg:r25(e1*x),reps:1}}));
    out.push({name:name,date:pick?pick.date:null,dayId:pick?pick.dayId:null,e1:e1,low:r25(e1*.97),high:r25(e1*1.03),last1:last1,after:!!(pick&&after&&pick.date===after.date),earliest:earliest,ladder:ladder});
  });
  out.sort(function(a,b){return (a.date||'9999')<(b.date||'9999')?-1:1});
  _pc={k:k,v:out};return out;
}
function plansOn(ds){return plans1RM().filter(function(p){return p.date===ds})}
function ladderText(p){
  var w=p.ladder.slice(0,4).map(function(x){return fmt(x.kg)+' × '+x.reps}).join(', ');
  var a=p.ladder.slice(4).map(function(x){return fmt(x.kg)}).join(', ');
  return 'Opvarmning: '+w+'. Forsøg: '+a+' kg.';
}
function testBanner(ex){
  if(!S.active||ex.kind==='time')return '';
  var p=plansOn(S.active.date).find(function(x){return x.name.toLowerCase()===ex.name.toLowerCase()});
  if(!p)return '';
  return '<div class="tp"><b>1RM-dag.</b> Forventet ca. '+fmt(p.low)+' til '+fmt(p.high)+' kg. '+esc(ladderText(p))+'<button data-a="applyLadder" data-ex="'+ex.id+'">Sæt 1RM-forsøg ind</button></div>';
}

/* ---------- training analysis + suggestions ---------- */
function volumeByMuscle(){
  var today=todayStr(),since=addDays(today,-28),ss=sortedSessions().filter(function(x){return x.date>=since}),per={},src='plan';
  if(ss.length>=4){
    src='log';
    var wk=Math.max(1,Math.min(4,Math.round(daysBetween(ss[0].date,today)/7)));
    ss.forEach(function(x){x.exercises.forEach(function(e){var m=muscleOf(e.name);if(m)per[m]=(per[m]||0)+e.sets.length})});
    Object.keys(per).forEach(function(k){per[k]=per[k]/wk});
  }else{
    var tpw=Math.max(1,S.plan.pattern.reduce(function(a,b){return a+b},0)),f=S.program.length?tpw/S.program.length:1;
    S.program.forEach(function(d){d.exercises.forEach(function(e){var m=muscleOf(e.name);if(m)per[m]=(per[m]||0)+(e.sets||0)*f})});
  }
  return{per:per,src:src};
}
function exerciseSuggestions(){
  var v=volumeByMuscle(),used={},out=[],seen={};
  S.program.forEach(function(d){d.exercises.forEach(function(e){used[e.name.toLowerCase()]=1})});
  Object.keys(allNames()).forEach(function(n){used[n.toLowerCase()]=1});
  function add(name,reason){if(seen[name]||out.length>=5)return;seen[name]=1;var d=defaultsFor(name);out.push({name:name,reason:reason,def:d})}
  var low=MUSCLES.filter(function(m){return (v.per[m]||0)<MIN_SETS[m]}).sort(function(a,b){return (v.per[a]||0)/MIN_SETS[a]-(v.per[b]||0)/MIN_SETS[b]});
  low.slice(0,3).forEach(function(m){
    var opts=LIB.filter(function(l){return l[2]===m&&!used[l[0].toLowerCase()]});
    var pick=opts.find(function(l){return l[4]==='c'})||opts[0];
    if(pick)add(pick[0],((v.per[m]||0)<0.5?'Du har ingen sæt til '+m.toLowerCase()+' i din træning.':'Du har kun ca. '+fmt(Math.round((v.per[m]||0)*10)/10)+' sæt pr. uge til '+m.toLowerCase()+'.')+' De fleste får mest ud af mindst '+MIN_SETS[m]+'. '+pick[0]+' er et godt sted at starte.');
  });
  var counts=allNames(),top=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]});
  top.slice(0,3).forEach(function(n){
    var key=Object.keys(VARS).find(function(k){return k.toLowerCase()===n.toLowerCase()});
    if(!key)return;
    var vr=VARS[key].find(function(x){return !used[x.toLowerCase()]});
    if(vr)add(vr,'Du bruger '+n+' meget ('+counts[n]+' pas). '+vr+' belaster det fra en ny vinkel og kan give dig mere styrke og størrelse.');
  });
  return out;
}

var PLS=[[25,23,78],[20,21,72],[15,18,60],[10,15,48],[5,12,36],[2.5,10,28],[1.25,8,22]];
function decomp(ps){var out=[];ps=Math.round(ps/1.25)*1.25;PLS.forEach(function(p){while(ps>=p[0]-1e-6){out.push(p);ps-=p[0]}});return out}
function barbell(top,goal,n){
  var cx=170,y=44,gid='pg'+n;
  var solid=decomp(Math.max(0,(top-20)/2)),ghost=decomp(Math.max(0,(goal-Math.max(top,20))/2));
  var h='<svg class="bb" viewBox="0 0 340 88" role="img" aria-label="Stang med '+fmt(top)+' kg, mål '+fmt(goal)+' kg"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--violet)"/><stop offset="1" style="stop-color:var(--acc2)"/></linearGradient></defs>';
  h+='<rect x="6" y="'+(y-3)+'" width="328" height="6" rx="3" style="fill:var(--muted);opacity:.42"/>';
  h+='<rect x="'+(cx-30)+'" y="'+(y-4.5)+'" width="60" height="9" rx="2" style="fill:var(--muted);opacity:.32"/>';
  [-1,1].forEach(function(sd){h+='<rect x="'+(sd<0?cx-54:cx+48)+'" y="'+(y-14)+'" width="6" height="28" rx="2" style="fill:var(--muted);opacity:.7"/>'});
  var off=58,k=0;
  function draw(list,ghostMode){
    list.forEach(function(p){
      var w=p[1],ht=p[2];
      if(off+w>164)return;
      [-1,1].forEach(function(sd){
        var x=sd<0?cx-off-w:cx+off;
        h+='<rect class="plate'+(ghostMode?' ghost':'')+'" style="--k:'+k+';--n:'+n+(ghostMode?';fill:rgba(var(--acc-rgb),.08);stroke:var(--orchid);stroke-opacity:.7;stroke-dasharray:3 3':'')+'" x="'+x+'" y="'+(y-ht/2)+'" width="'+w+'" height="'+ht+'" rx="4"'+(ghostMode?'':' fill="url(#'+gid+')"')+'/>';
      });
      off+=w+3;k++;
    });
  }
  draw(solid,false);draw(ghost,true);
  return h+'</svg>';
}

/* chart */
function chart(pts,o){
  if(!pts.length)return '<div class="empty">Ingen data endnu</div>';
  var W=340,H=200,pl=40,pr=14,pt=16,pb=28;
  var vals=pts.map(function(p){return p.y});
  if(o.goal!=null)vals.push(o.goal);
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  if(hi===lo){hi+=5;lo-=5}
  var padv=(hi-lo)*.12;lo=Math.max(0,lo-padv);hi=hi+padv;
  function X(i){return pts.length===1?(pl+(W-pl-pr)/2):pl+i*(W-pl-pr)/(pts.length-1)}
  function Y(v){return pt+(H-pt-pb)*(1-(v-lo)/(hi-lo))}
  var g='',i;
  for(i=0;i<3;i++){
    var v=lo+(hi-lo)*i/2,y=Y(v);
    g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)" stroke-width="1"/>'
      +'<text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" style="fill:var(--muted)">'+Math.round(v)+'</text>';
  }
  var line=pts.map(function(p,i){return(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)}).join(' ');
  var area=line+' L'+X(pts.length-1).toFixed(1)+' '+(H-pb)+' L'+X(0).toFixed(1)+' '+(H-pb)+' Z';
  var goal='';
  if(o.goal!=null){
    var gy=Y(o.goal);
    goal='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'" style="stroke:var(--gold)" stroke-width="1.5" stroke-dasharray="5 5"/>'
      +'<text x="'+(W-pr)+'" y="'+(gy-6)+'" text-anchor="end" font-size="11" font-weight="700" style="fill:var(--gold)">Mål '+fmt(o.goal)+'</text>';
  }
  var dots=pts.map(function(p,i){
    var last=i===pts.length-1;
    return '<circle class="dt" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(last?5.5:3.5)+'" style="fill:'+(last?'var(--orchid)':'var(--bg)')+';stroke:var(--orchid)" stroke-width="2"/>';
  }).join('');
  var lastP=pts[pts.length-1],lx=X(pts.length-1);
  var lab='<text class="dt" x="'+Math.min(lx,W-pr-12)+'" y="'+(Y(lastP.y)-11)+'" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--text)">'+fmt(lastP.y)+'</text>';
  var xl='<text x="'+X(0)+'" y="'+(H-8)+'" text-anchor="'+(pts.length===1?'middle':'start')+'" font-size="11" style="fill:var(--muted)">'+esc(pts[0].label)+'</text>';
  if(pts.length>1)xl+='<text x="'+X(pts.length-1)+'" y="'+(H-8)+'" text-anchor="end" font-size="11" style="fill:var(--muted)">'+esc(lastP.label)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Graf"><defs><linearGradient id="'+o.id+'" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--violet)" stop-opacity=".5"/><stop offset="1" style="stop-color:var(--violet)" stop-opacity="0"/></linearGradient></defs>'
    +g+goal+(pts.length>1?'<path class="ar" d="'+area+'" fill="url(#'+o.id+')"/>':'')+'<path class="ln" pathLength="1" d="'+line+'" fill="none" style="stroke:var(--orchid)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+lab+xl+'</svg>';
}
function shortD(s){var d=parseD(s);return d.getDate()+'/'+(d.getMonth()+1)}

function viewProgress(){
  var counts=allNames(),names=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]||a.localeCompare(b,'da')});
  var h='<main'+mc(1)+'><div class="sec"><h2>Fremgang</h2></div>';
  var ss=sortedSessions();
  var now=new Date(),dow=(now.getDay()+6)%7,mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow),ms=todayStr(mon);
  var wk=S.sessions.filter(function(s){return s.date>=ms}).length;
  h+='<div class="stats"><div class="stat"><b>'+S.sessions.length+'</b><span>Pas i alt</span></div><div class="stat"><b>'+wk+' / '+S.goals.weekly+'</b><span>Denne uge</span></div><div class="stat"><b>'+(ss.length?shortD(ss[ss.length-1].date):'–')+'</b><span>Seneste pas</span></div></div>';
  if(!names.length){return h+'<div class="empty">Log dit første pas, så dukker grafen op her.</div></main>'}
  var cur=ui.progEx&&counts[ui.progEx]?ui.progEx:(counts['Bænkpres']?'Bænkpres':names[0]);
  ui.progEx=cur;
  var kind=kindOf(cur),H=hist(cur);
  var metric=kind==='time'?'top':ui.metric;
  h+='<select class="sel" data-sel="progEx" aria-label="Vælg øvelse">'+names.map(function(n){return '<option'+(n===cur?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select>';
  if(kind!=='time'){
    h+='<div class="seg">'+[['top','Topvægt'],['e1','Est. 1RM'],['vol','Volumen']].map(function(m){return '<button data-a="metric" data-v="'+m[0]+'" class="'+(metric===m[0]?'on':'')+'">'+m[1]+'</button>'}).join('')+'</div>';
  }
  var pts=H.map(function(e){
    var y=0;
    if(metric==='top'){e.sets.forEach(function(s){var v=kind==='time'?s.reps:s.kg;if(v>y)y=v})}
    else if(metric==='e1'){e.sets.forEach(function(s){if(s.reps<=12){var v=e1rm(s.kg,s.reps);if(v>y)y=v}})}
    else{e.sets.forEach(function(s){y+=s.kg*s.reps})}
    return{y:Math.round(y*10)/10,label:shortD(e.date)};
  });
  var goal=null,g=S.goals.lifts.find(function(x){return x.name.toLowerCase()===cur.toLowerCase()});
  if(g&&metric==='top')goal=g.kg;
  if(g&&metric==='e1')goal=Math.round(e1rm(g.kg,g.reps));
  h+='<div class="chartbox">'+chart(pts,{goal:goal,id:'gx'})+'</div>';
  var bestSet=null;H.forEach(function(e){e.sets.forEach(function(s){if(!bestSet||valOf(kind,s)>valOf(kind,bestSet))bestSet=s})});
  var bv=bestVal(cur);
  h+='<div class="stats"><div class="stat"><b>'+(bestSet?(kind==='time'?bestSet.reps+' sek':fmt(bestSet.kg)+' × '+bestSet.reps):'–')+'</b><span>Bedste sæt</span></div>'
    +'<div class="stat"><b>'+(kind==='time'?'–':fmt(Math.round(bv))+' kg')+'</b><span>Est. 1RM</span></div>'
    +'<div class="stat"><b>'+H.length+'</b><span>Pas med øvelsen</span></div></div>';
  h+='<div class="sec"><h2>Seneste pas</h2></div><div class="card">'+H.slice().reverse().slice(0,8).map(function(e){
    return '<div class="logrow"><span>'+fmtDate(e.date)+'</span><span>'+setsText(e.sets,kind)+'</span></div>'}).join('')+'</div>';
  return h+'</main>';
}
function setsText(sets,kind){
  if(kind==='time')return sets.map(function(s){return s.reps+' sek'}).join(', ');
  var same=sets.every(function(s){return s.kg===sets[0].kg});
  if(same)return fmt(sets[0].kg)+' kg × '+sets.map(function(s){return s.reps}).join(', ');
  return sets.map(function(s){return fmt(s.kg)+'×'+s.reps}).join(', ');
}

/* workout view */
function lastText(name){
  var h=hist(name);if(!h.length)return '';
  var l=h[h.length-1];
  return '<div class="last">Sidst, '+fmtDate(l.date)+': <b>'+setsText(l.sets,l.kind)+'</b></div>';
}
function prFlags(ex){
  var flags={},kind=ex.kind,H=hist(ex.name);
  if(!H.length)return flags;
  var rec=records(ex.name),mk=rec.maxKg?rec.maxKg.kg:0,one=rec.one?rec.one.kg:0,be=rec.e1?rec.e1.v:0,mr=rec.maxReps?rec.maxReps.reps:0;
  var extra=[];
  function repsAtOrAbove(kg){var b=0;H.forEach(function(e){e.sets.forEach(function(x){if(x.kg>=kg&&x.reps>b)b=x.reps})});extra.forEach(function(x){if(x.kg>=kg&&x.reps>b)b=x.reps});return b}
  ex.sets.forEach(function(s,i){
    if(!s.done||s.warm)return;
    var kg=num(s.kg),reps=num(s.reps);
    if(kind==='time'){if(reps>mr){flags[i]='Ny rekord';mr=reps}return}
    if(kg<=0||reps<=0)return;
    var lab=null;
    if(reps===1&&kg>one)lab='1RM-rekord';
    else if(kg>mk)lab='Tungeste løft';
    else if(reps>repsAtOrAbove(kg))lab='Rep-rekord';
    else if(reps<=12&&e1rm(kg,reps)>be*1.0001)lab='Ny rekord';
    if(reps===1&&kg>one)one=kg;
    if(kg>mk)mk=kg;
    if(reps<=12){var v=e1rm(kg,reps);if(v>be)be=v}
    extra.push({kg:kg,reps:reps});
    if(lab)flags[i]=lab;
  });
  return flags;
}

/* ---------- toast / timer / sound / wake lock ---------- */
var RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function fmtD(n,dec){var x=dec?Math.round(n*10)/10:Math.round(n);return dec?String(x).replace('.',','):x.toLocaleString('da-DK')}
function countUp(el,to,dec,dur,delay){
  if(RM)return;
  var start=performance.now()+(delay||0);
  el.textContent=fmtD(0,dec);
  (function f(now){
    var p=Math.max(0,Math.min(1,(now-start)/dur)),e=1-Math.pow(1-p,3);
    el.textContent=fmtD(to*e,dec);
    if(p<1)requestAnimationFrame(f);else el.textContent=fmtD(to,dec);
  })(performance.now());
}
function buzz(p){if(!S.settings.vibrate)return;try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function confetti(x,y,n){
  if(RM)return;
  var cs=['--violet','--acc2','--orchid','--lilac','--gold'].map(function(k){return getComputedStyle(document.documentElement).getPropertyValue(k).trim()||'#a78bfa'});
  for(var i=0;i<(n||24);i++){
    var p=document.createElement('i');
    p.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;width:'+(5+Math.random()*5)+'px;height:'+(8+Math.random()*9)+'px;background:'+cs[i%cs.length]+';border-radius:2px;z-index:130;pointer-events:none';
    document.body.appendChild(p);
    var ang=Math.random()*Math.PI*2,dist=60+Math.random()*150,dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist-70;
    if(p.animate){
      var an=p.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+dx+'px,'+(dy+140)+'px) rotate('+(Math.random()*900-450)+'deg)',opacity:0}],{duration:1000+Math.random()*600,easing:'cubic-bezier(.15,.7,.3,1)'});
      an.onfinish=(function(el){return function(){el.remove()}})(p);
    }else p.remove();
  }
}
var toastT;
function toast(msg){
  var t=$('#toast');t.innerHTML='<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toastT);toastT=setTimeout(function(){t.innerHTML=''},3200);

var actx;
function beep(){
  if(S.settings.sound)try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();var o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(actx.currentTime+.3)}catch(e){}
  if(S.settings.vibrate)try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
}

  sec=sec||S.rest;

  rest={end:Date.now()+sec*1000,total:sec,key:key||''};restShown=false;

function tick(){
  var el=$('#elapsed');
  if(el&&S.active)el.textContent=Math.floor((Date.now()-S.active.startedAt)/60000)+' min';
  var r=$('#rest');
  if(!r){if(rest&&Date.now()>rest.end)rest=null;restShown=false;return}
  if(!rest){r.hidden=true;restShown=false;return}
  var left=Math.ceil((rest.end-Date.now())/1000);
  if(left<=0){rest=null;r.hidden=true;r.classList.remove('low','show');restShown=false;beep();toast('Hvilen er slut, klar til næste sæt');return}
  if(r.hidden){r.hidden=false;if(!restShown){r.classList.remove('show');void r.offsetWidth;r.classList.add('show')}restShown=true}
  r.classList.toggle('low',left<=5);

}

/* ---------- workout actions ---------- */
function findEx(id){return S.active&&S.active.exercises.find(function(e){return e.id===id})}
function makeEx(name,sets,reps,note,kind){
  var last=hist(name),l=last.length?last[last.length-1]:null,out=[],sg=l?null:suggestKg(name);
  for(var i=0;i<sets;i++){
    var ls=l&&(l.sets[i]||l.sets[l.sets.length-1]);
    out.push({kg:ls?ls.kg:(sg&&sg.kg?sg.kg:''),reps:ls?ls.reps:(firstNum(reps)||''),rir:null,done:false});
  }
  return{id:uid(),name:name,kind:kind||'reps',target:sets+' × '+reps,targetReps:String(reps),note:(note||'')+(sg&&sg.from?(note?' ':'')+'Vægt foreslået ud fra '+sg.from+'.':''),sets:out};
}
function makeExPlan(p){
  var out=[];
  for(var i=0;i<p.sets;i++)out.push({kg:p.kg!=null?p.kg:'',reps:firstNum(p.reps)||'',rir:null,done:false});
  return{id:uid(),name:p.name,kind:p.kind,target:p.sets+' × '+p.reps,targetReps:String(p.reps),note:p.note+(p.kg?' (ca. 90 % af '+fmt(p.top)+' kg)':''),sets:out};

function startWorkout(id,dl){

  var sw=(S.swaps||{})[id],map=(sw&&!dl)?sw.map:{},ds=todayStr(),ci=S.checkin[ds]||{},rd=readiness(id);
  var adapt=!dl&&S.settings.adapt&&!ci.skip&&rd.setMod<0,st=S.settings.step;
  var exs=dl?deloadFor(d).map(makeExPlan):d.exercises.map(function(e){
    var nm=map[e.name];
    if(nm){var sc=schemeFor(nm,{sets:e.sets,reps:e.reps}),x1=makeEx(nm,sc.sets,sc.reps,'Byttet ud for '+e.name+'.',sc.kind);x1.ss=!!e.ss;return x1}
    var x2=makeEx(e.name,e.sets||2,e.reps,e.note,e.kind);x2.ss=!!e.ss;return x2;
  });
  if(adapt)exs.forEach(function(x){
    if(x.sets.length>2)x.sets.pop();
    x.sets.forEach(function(q){var kg=num(q.kg);if(x.kind!=='time'&&kg>0)q.kg=Math.max(st,Math.round(kg*rd.load/st)*st)});

  });

    ci:(ci.sleep!=null||ci.food)?{sleep:ci.sleep==null?null:ci.sleep,food:ci.food||rd.food,h:new Date().getHours()}:null,exercises:exs};
  save();ui.view='workout';rest=null;window.scrollTo(0,0);render();lock();
}

function finishWorkout(){
  var a=S.active,exs=[],prs=0,prNames=[];
  a.exercises.forEach(function(ex){
    var pr=prFlags(ex);prs+=Object.keys(pr).length;if(Object.keys(pr).length)prNames.push(ex.name);
    var sets=[];

    });

  });
  var ses={id:uid(),date:a.date,dayId:a.dayId,dayName:a.name,focus:a.focus,durationMin:Math.round((Date.now()-a.startedAt)/60000),deload:!!a.deload,note:a.note||'',ci:a.ci||null,adapted:a.adapted||null,exercises:exs};

function modeReps(sets){var c={},best=null,bn=0;sets.forEach(function(x){c[x.reps]=(c[x.reps]||0)+1;if(c[x.reps]>bn){bn=c[x.reps];best=x.reps}});return best}
function tplFromSession(ses){

    var kind=e.kind||'reps',reps=kind==='time'?(modeReps(e.sets)||30)+' sek':String(modeReps(e.sets)||8),old=d&&d.exercises.find(function(x){return x.name===e.name});

function learnDiff(ses){

  var a=d.exercises.map(function(e){return e.name}).sort().join('|'),b=ses.exercises.map(function(e){return e.name}).sort().join('|');

function regionOf(list){
  var reg={},best=null,bn=0;
  list.forEach(function(e){var m=muscleOf(e.name),r=m?REGION[m]:null;if(r){reg[r]=(reg[r]||0)+1;if(reg[r]>bn){bn=reg[r];best=r}}});
  return best;
}
function alignPlan(ses){
  var best=regionOf(ses.exercises),out=[];
  if(!best)return out;
  S.program.forEach(function(d){
    if(d.id===ses.dayId||regionOf(d.exercises)!==best)return;
    var names={},map={},used={};
    d.exercises.forEach(function(e){names[e.name]=1});
    ses.exercises.forEach(function(x){
      if(Object.keys(map).length>=3||names[x.name])return;
      var m=muscleOf(x.name);if(!m)return;
      var tgt=d.exercises.find(function(e){return !used[e.name]&&muscleOf(e.name)===m&&e.name!==x.name&&!ses.exercises.some(function(y){return y.name===e.name})});
      if(tgt){map[tgt.name]=x.name;used[tgt.name]=1}
    });
    if(Object.keys(map).length)out.push({dayId:d.id,name:d.name+' '+(d.focus||''),map:map});
  });
  return out;
}

    case 'exGroup':ui.exg=t.dataset.g;render();break;
    case 'burger':ui.drawer=true;chrome();break;
    case 'drClose':ui.drawer=false;chrome();break;
    case 'go':
      ui.drawer=false;
      if(t.dataset.p==='backup'){sheet={type:'backup',mode:'main'};chrome();renderSheet()}
      else if(t.dataset.p.indexOf('tab:')===0){ui.tab=t.dataset.p.slice(4);ui.page=null;ui.fx=true;window.scrollTo(0,0);render()}
      else{ui.page=t.dataset.p;ui.fx=true;window.scrollTo(0,0);render()}
      break;
    case 'pageBack':ui.page=null;ui.fx=true;window.scrollTo(0,0);render();break;
    case 'pickDay':sheet={type:'pickday'};renderSheet();break;
    case 'soreToday':ui.soreDate=null;render();break;
    case 'openZones':sheet={type:'zones',group:t.dataset.g,date:ui.soreDate||todayStr(),view:null};renderSheet();break;
    case 'zone':
      var zk=t.dataset.z,zd=t.dataset.d,zl=(zoneLevel(zd,zk)+1)%3;setZone(zd,zk,zl);save();buzz(8);
      if(sheet&&sheet.type==='zones')renderSheet(true);else render();
      break;
    case 'zoneView':sheet.view=t.dataset.v;renderSheet(true);break;
    case 'zoneClear':
      Object.keys(S.soreZ[sheet.date]||{}).forEach(function(k){if(k.split('|')[0]===sheet.group)setZone(sheet.date,k,0)});
      var gm=S.sore[sheet.date]||(S.sore[sheet.date]={});delete gm[sheet.group];delete gm.none;save();renderSheet(true);break;
    case 'swapDo':
      var swd=t.dataset.id,swm=S.swaps[swd]||(S.swaps[swd]={map:{}});swm.map[t.dataset.ex]=t.dataset.n;save();render();toast('Byttet til '+t.dataset.n+' i det næste pas');break;
    case 'swapUndo':
      var swu=S.swaps[t.dataset.id];if(swu){delete swu.map[t.dataset.ex];if(!Object.keys(swu.map).length)delete S.swaps[t.dataset.id]}save();render();break;
    case 'tog':S.settings[t.dataset.k]=!S.settings[t.dataset.k];save();render();break;
    case 'setStep':S.settings.step=+t.dataset.v;save();render();break;
    case 'addWarm':
      ex=findEx(t.dataset.ex);
      var fw=ex.sets.find(function(x){return !x.warm}),ws=warmSets(num(fw.kg));
      if(ws.length){ex.sets=ws.concat(ex.sets);ex.warmAdded=true;save();render();toast('Opvarmningssæt tilføjet')}
      break;
    case 'deloadEvery':
      S.deload.every=+t.dataset.v;if(S.deload.every>0){S.deload.next=null;initDeload()}save();render();break;
    case 'deloadNow':S.deload.next=mondayOf(todayStr());save();render();toast('Denne uge er deload');break;
    case 'deloadPostpone':initDeload();S.deload.next=addDays(S.deload.next,7);save();render();toast('Deload er udskudt en uge');break;
    case 'dlPlan':sheet={type:'dlplan',id:t.dataset.id};renderSheet();break;
    case 'recAll':ui.recAll=!ui.recAll;render();break;
    case 'sugAdd':pop=null;renderPop();sheet={type:'addToDay',n:t.dataset.n};renderSheet();break;
    case 'sugToDay':
      var dd2=S.program.find(function(x){return x.id===t.dataset.id}),df3=defaultsFor(sheet.n),nm2=sheet.n;
      if(dd2){dd2.exercises.push({name:nm2,sets:df3.sets,reps:df3.reps,kind:df3.kind,note:''});save();sheet=null;render();toast(nm2+' er lagt til '+dd2.name)}
      break;
    case 'applyLadder':
      ex=findEx(t.dataset.ex);
      var pl2=plansOn(S.active.date).find(function(x){return x.name.toLowerCase()===ex.name.toLowerCase()});
      if(pl2){ex.sets=pl2.ladder.map(function(x){return{kg:x.kg,reps:x.reps,rir:null,done:false}});ex.target='1RM-test';ex.note='Opvarm og tag forsøgene. Hvil 3–5 min før hvert forsøg.';save();render()}
      break;
  }
});

var drag=null;
function endDrag(commit){
  if(!drag)return;
  var d=drag;drag=null;
  d.rows.forEach(function(r){r.style.transform='';r.classList.remove('dragging')});
  d.panel.classList.remove('dragmode');
  if(commit&&d.to!==d.i&&sheet&&sheet.draft){var ar=sheet.draft.exercises,it=ar.splice(d.i,1)[0];ar.splice(d.to,0,it);buzz(10)}
  renderSheet(true);
}
document.addEventListener('pointerdown',function(e){
  var g=e.target.closest&&e.target.closest('.grip');
  if(!g||!sheet||sheet.type!=='day')return;
  e.preventDefault();
  var panel=document.querySelector('.panel'),rows=[].slice.call(panel.querySelectorAll('.erow')),i=+g.dataset.i;
  panel.classList.add('dragmode');void panel.offsetHeight;
  drag={i:i,to:i,startY:e.clientY,panel:panel,rows:rows,rects:rows.map(function(r){return r.getBoundingClientRect()})};
  rows[i].classList.add('dragging');
  try{g.setPointerCapture(e.pointerId)}catch(er){}
  buzz(8);
});
document.addEventListener('pointermove',function(e){
  if(!drag)return;
  var dy=e.clientY-drag.startY,i=drag.i,r0=drag.rects[i],center=r0.top+r0.height/2+dy,to=i,k;
  drag.rows[i].style.transform='translateY('+dy+'px)';
  for(k=0;k<i;k++){if(center<drag.rects[k].top+drag.rects[k].height/2){to=k;break}}
  for(k=drag.rows.length-1;k>i;k--){if(center>drag.rects[k].top+drag.rects[k].height/2){to=k;break}}
  drag.to=to;
  var sh=r0.height+10;
  drag.rows.forEach(function(r,j){
    if(j===i)return;
    var off=0;
    if(to<i&&j>=to&&j<i)off=sh;
    if(to>i&&j>i&&j<=to)off=-sh;
    r.style.transform=off?'translateY('+off+'px)':'';
  });
});
document.addEventListener('pointerup',function(){endDrag(true)});
document.addEventListener('pointercancel',function(){endDrag(false)});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.sedit&&sheet&&sheet.type==='sesedit'){setPath(sheet.draft.exercises,t.dataset.sedit,num(t.value));return}
  if(t.dataset.sedate!==undefined&&sheet&&sheet.type==='sesedit'){if(t.value)sheet.draft.date=t.value;return}
  if(t.dataset.senote!==undefined&&sheet&&sheet.type==='sesedit'){sheet.draft.note=t.value;return}
  if(t.id==='exs'){ui.exq=t.value;var xe=$('#exlist');if(xe)xe.innerHTML=exListHtml();return}
  if(t.dataset.note!==undefined&&S.active){S.active.note=t.value;save();return}
  if(t.dataset.f&&t.dataset.ex){
    var ex=findEx(t.dataset.ex);if(!ex)return;
    ex.sets[+t.dataset.i][t.dataset.f]=t.value;save();return;
  }
  if(t.dataset.draft&&sheet&&sheet.draft){setPath(sheet.draft,t.dataset.draft,t.value);return}
  if(t.id==='exq'&&sheet&&sheet.type==='addEx'){sheet.q=t.value;sheet.focus=1;renderSheet()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.swapto!==undefined&&t.value&&sheet&&sheet.type==='swappick'){
    var sw0=S.swaps[sheet.id]||(S.swaps[sheet.id]={map:{}});
    if(t.value===sheet.ex)delete sw0.map[sheet.ex];else sw0.map[sheet.ex]=t.value;
    if(!Object.keys(sw0.map).length)delete S.swaps[sheet.id];
    save();var picked=t.value;sheet=null;render();toast(picked===undefined?'':'Skiftet til '+picked+' næste gang');return}
  if(t.dataset.seadd!==undefined&&t.value&&sheet&&sheet.type==='sesedit'){
    var nm0=t.value,sg0=suggestKg(nm0),df0=defaultsFor(nm0),k0=kindOf(nm0),ss0=[];
    for(var q0=0;q0<3;q0++)ss0.push({kg:k0==='time'?0:(sg0.kg||0),reps:firstNum(df0.reps)||8,rir:null});
    sheet.draft.exercises.push({name:nm0,kind:k0,sets:ss0});renderSheet(true);return}
  if(t.dataset.pick!==undefined&&t.value&&sheet&&sheet.draft){var pe=sheet.draft.exercises[+t.dataset.pick],sc=schemeFor(t.value,{sets:pe.sets,reps:pe.reps});pe.name=t.value;pe.sets=sc.sets;pe.reps=sc.reps;pe.kind=sc.kind;renderSheet(true);toast('Sæt og reps tilpasset: '+sc.sets+' × '+sc.reps);return}
  if(t.dataset.addpick!==undefined&&t.value&&S.active){addExerciseToWorkout(t.value);return}
  if(t.dataset.deloadnext&&t.value){S.deload.next=mondayOf(t.value);save();render();return}
  if(t.dataset.sel==='progEx'){ui.progEx=t.value;ui.fx=true;render();return}
  if(t.dataset.sesdate){var s=S.sessions.find(function(x){return x.id===t.dataset.sesdate});if(s&&t.value){s.date=t.value;save();render()}return}
  if(t.dataset.goal){
    var v=num(t.value);if(v<=0)v=1;
    setPath(S.goals,t.dataset.goal,v);save();return;
  }
  if(t.id==='bkFile'&&t.files&&t.files[0]){
    var r=new FileReader();r.onload=function(){var ta=$('#bk');if(ta)ta.value=r.result;toast('Fil indlæst, tryk Gendan')};r.readAsText(t.files[0]);
  }
});

applyCustom();
if(!S.welcomed)sheet={type:'welcome'};else if(!S.progOffer)sheet={type:'newprog'};
applyTheme();
render();
(function(){
  var pre=document.getElementById('pre');
  if(!pre)return;
  if(document.documentElement.classList.contains('nopre')||!S.settings.preloader){pre.remove();return}
  var n=document.getElementById('preN'),t0=performance.now(),done=false;
  var arc=document.getElementById('preArc'),glow=document.getElementById('preGlow'),nd=document.getElementById('preNeedle');
  function out(){if(done)return;done=true;pre.classList.add('out');setTimeout(function(){pre.remove()},650)}
  pre.addEventListener('click',out);
  function setG(e){
    n.textContent=Math.round(100*e);
    var d=(0.75*e).toFixed(4)+' 1';arc.style.strokeDasharray=d;glow.style.strokeDasharray=d;
    nd.setAttribute('transform','rotate('+(-135+270*e).toFixed(2)+' 110 110)');
  }
  (function f(now){
    var p=Math.min(1,Math.max(0,(now-t0-600)/1600)),e=1-Math.pow(1-p,3);
    setG(e);
    if(now-t0<2400)requestAnimationFrame(f);
  })(t0);
  if(RM)setG(1);
  setTimeout(out,RM?900:3300);
  setTimeout(out,4500);
})();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  var hadSW=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadSW&&!S.active&&!window.__reloaded){window.__reloaded=true;location.reload()}});
  window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}});
}
if(ui.view==='workout')lock();
})();
</script>
